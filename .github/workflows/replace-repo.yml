name: Replace Repository With Ngenaz Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Ngenaz ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract new project
        shell: bash
        run: |
          rm -rf /tmp/ngenaz
          mkdir -p /tmp/ngenaz

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/ngenaz

      - name: Locate project root
        shell: bash
        run: |
          if [ -f /tmp/ngenaz/package.json ]; then
            echo "Project is at ZIP root."
          else
            PROJECT=$(find /tmp/ngenaz -name package.json -type f | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            echo "Project found at: $(dirname "$PROJECT")"
          fi

      - name: Replace repository files
        shell: bash
        run: |
          if [ -f /tmp/ngenaz/package.json ]; then
            PROJECT_ROOT="/tmp/ngenaz"
          else
            PROJECT_ROOT=$(dirname "$(find /tmp/ngenaz -name package.json -type f | head -n 1)")
          fi

          # Remove existing tracked/untracked project files
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Copy new project
          cp -a "$PROJECT_ROOT"/. .

          # Remove the ZIP after extraction
          rm -f *.zip

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Replace site with finalized Ngenaz Builders build" || \
            echo "No changes to commit"

          git push
