name: Replace Site With Ngenaz Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find replacement ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*fixed*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Fixed Ngenaz ZIP not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract replacement
        run: |
          rm -rf /tmp/ngenaz-final
          mkdir -p /tmp/ngenaz-final

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d /tmp/ngenaz-final

      - name: Locate project
        id: project
        shell: bash
        run: |
          PROJECT_ROOT=$(dirname "$(find /tmp/ngenaz-final -name package.json -type f | head -n 1)")

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "Project: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare replacement
        run: |
          PROJECT_ROOT="${{ steps.project.outputs.project_root }}"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          cp -a "$PROJECT_ROOT"/. .

          rm -f *.zip

      - name: Install dependencies
        run: |
          npm install
          npm install -D tailwindcss-animate@^1.0.7

      - name: Production build
        run: npm run build

      - name: Commit final site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Finalize Ngenaz Builders website" || \
            echo "No changes to commit"

          git push
