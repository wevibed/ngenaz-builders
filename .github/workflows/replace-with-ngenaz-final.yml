name: Replace Site With Ngenaz Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find replacement ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Upload the Ngenaz final ZIP to the repository first."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract replacement ZIP
        shell: bash
        run: |
          rm -rf /tmp/ngenaz-final
          mkdir -p /tmp/ngenaz-final

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d /tmp/ngenaz-final

          echo "ZIP extracted."

      - name: Locate actual project
        id: project
        shell: bash
        run: |
          if [ -f "/tmp/ngenaz-final/package.json" ]; then
            PROJECT_ROOT="/tmp/ngenaz-final"
          else
            PROJECT_ROOT=$(dirname "$(find /tmp/ngenaz-final -name package.json -type f | head -n 1)")
          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/package.json" ]; then
            echo "ERROR: Could not find package.json in replacement ZIP."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Remove old site
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

      - name: Copy new Ngenaz site
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps.project.outputs.project_root }}"

          cp -a "$PROJECT_ROOT"/. .

          echo "New Ngenaz site copied."

      - name: Remove replacement ZIP
        shell: bash
        run: |
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Verify project
        shell: bash
        run: |
          test -f package.json
          test -f index.html

          echo "package.json found."
          echo "index.html found."
          echo "Ngenaz replacement verified."

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Replace site with finalized Ngenaz Builders build" || {
            echo "No changes to commit."
            exit 0
          }

          git push
